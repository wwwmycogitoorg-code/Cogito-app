name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Create www folder
        run: mkdir -p www && echo "<html></html>" > www/index.html

      - name: Add Android platform
        run: npx cap add android

      - name: Copy google-services.json
        run: cp google-services.json android/app/google-services.json

      - name: DEBUG - Show gradle files
        run: |
          echo "=== Fichiers dans android/ ==="
          ls -la android/
          echo "=== Contenu build.gradle (racine) ==="
          cat android/build.gradle.kts 2>/dev/null || cat android/build.gradle 2>/dev/null
          echo "=== Contenu build.gradle (app) ==="
          cat android/app/build.gradle.kts 2>/dev/null || cat android/app/build.gradle 2>/dev/null

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cogito-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
